<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Facturas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Facturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --paper:#EDF0EC; --card:#F8F9F6; --field:#FFFFFF; --ink:#17233B; --muted:#586477; --rule:#CBD3CB;
  --stamp:#2A37AE; --on-stamp:#FFFFFF; --stamp-soft:#E0E3F7;
  --danger:#B3261E; --ok:#1F6B47; --warn:#8A5A00;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1421; --card:#151D2F; --field:#1B2439; --ink:#E8ECF4; --muted:#9BA7BC; --rule:#2A3550;
    --stamp:#98A3FF; --on-stamp:#0E1421; --stamp-soft:#232D5A; --danger:#FF8F86; --ok:#7AD3A6; --warn:#F0BE62;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1421; --card:#151D2F; --field:#1B2439; --ink:#E8ECF4; --muted:#9BA7BC; --rule:#2A3550;
  --stamp:#98A3FF; --on-stamp:#0E1421; --stamp-soft:#232D5A; --danger:#FF8F86; --ok:#7AD3A6; --warn:#F0BE62;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
.num,.amt,td.r,.tot td{font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:14px 16px 128px}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px}

/* periodo */
.period{display:grid;gap:10px;margin-bottom:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--rule);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:38px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--field);color:var(--ink);font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between}
.pnav strong{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;text-transform:capitalize}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--field);font-size:22px;line-height:1}

/* herramientas y totales */
.tools{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-bottom:14px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--rule);background:var(--field);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.strip{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;padding:12px 0 14px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:6px}
.strip div{display:grid;gap:0}
.strip b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.strip .big b{font-size:21px;font-family:"Bricolage Grotesque",sans-serif}
.strip span{font-size:13px;color:var(--muted)}

/* filas */
ul.rows{list-style:none;margin:0;padding:0}
.grp{margin:20px 0 4px;color:var(--muted);font-size:14px;text-transform:capitalize}
.row{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 0;min-height:68px}
.thumb{width:44px;height:56px;border-radius:6px;object-fit:cover;background:var(--rule);display:block}
.thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:12px}
.row-main{display:grid;gap:1px;min-width:0}
.sup{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{display:grid;justify-items:end;gap:4px}
.amt{font-weight:600;font-size:16px}
.nopay{font-size:12.5px;color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:0 7px;line-height:20px}
.empty-state{padding:36px 8px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty-state strong{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:20px}

/* sello */
.stamp{display:inline-block;border:2px solid var(--stamp);outline:1px solid var(--stamp);outline-offset:2px;color:var(--stamp);border-radius:6px;padding:0 9px;font:700 15px/1.5 "Bricolage Grotesque",sans-serif;transform:rotate(-5deg);background:transparent}
.row-amt .stamp{margin-right:4px}
.stamp.sm{font-size:12.5px;padding:0 6px;line-height:18px;border-width:1.5px;outline-offset:1.5px}
.stamp.thump{animation:thump .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes thump{0%{transform:rotate(-5deg) scale(2.2);opacity:0}55%{opacity:1}100%{transform:rotate(-5deg) scale(1)}}

/* botones */
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--rule);background:var(--field);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--on-stamp)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;color:var(--stamp);font-weight:600;font-size:14.5px;padding:10px 2px;min-height:44px}
.link.danger{color:var(--danger)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.btn-row .btn{flex:1 1 140px}

/* barra de pestañas */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:0 auto}
@supports (background:color-mix(in srgb,red 50%,blue)){
  #tabs{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
}
#tabs button{display:grid;justify-items:center;gap:2px;background:none;border:0;min-height:54px;color:var(--muted);font-size:12px;font-weight:500;padding:4px 0;border-radius:12px}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-current="page"]{color:var(--stamp);font-weight:600}
#tabs .add span.plus{display:grid;place-items:center;width:46px;height:32px;border-radius:12px;background:var(--stamp);color:var(--on-stamp)}
#tabs .add{color:var(--ink);font-weight:600}

/* editor y hojas */
#editor{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.ed-bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:6px 10px}
.ed-bar h2{text-align:center;font-size:18px}
.ed-bar .link{justify-self:start}
.ed-body{max-width:560px;margin:0 auto;padding:16px 16px 140px;display:grid;gap:22px}
.ed-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--paper);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.ed-foot .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.fld{display:grid;gap:4px}
.fld>span{font-size:13.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{display:grid;gap:10px}
.photo img.pv{width:100%;max-height:300px;object-fit:contain;background:var(--rule);border-radius:10px;display:block}
.drop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop label{min-height:96px;flex-direction:column;border-style:dashed;border-width:2px;border-color:var(--muted);background:transparent}
.msg{font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--stamp-soft);color:var(--ink)}
.msg.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.msg.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.msg.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.line{display:grid;gap:8px;padding:12px;border:1px solid var(--rule);border-radius:12px}
.lnums{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.lcalc{grid-column:1/-1;display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.lcalc b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
table.tot{width:100%;border-collapse:collapse;font-size:15px}
.tot th{font-weight:500;color:var(--muted);text-align:left;padding:5px 0;font-size:13.5px}
.tot td{text-align:right;padding:5px 0}
.tot tr.sum td,.tot tr.sum th{border-top:2px solid var(--ink);padding-top:9px;color:var(--ink);font-size:18px;font-weight:700}
.tot tr.sum td{font-family:"Bricolage Grotesque",sans-serif}
.paid{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.paid div{flex:1 1 180px;font-size:14.5px}

#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,15,28,.5)}
#sheet .panel{position:relative;width:100%;max-width:560px;max-height:86%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:0 -6px 30px rgba(0,0,0,.25);outline:none}
#sheet .panel.full{max-height:94%;padding:10px}
#sheet .panel.full img{width:100%;display:block;border-radius:8px}
.opt{width:100%;text-align:left;background:var(--field);border:1px solid var(--rule);border-radius:12px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;min-height:56px}
.opt .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .s{font-size:13.5px;color:var(--muted);grid-column:1}
.opt .a{grid-row:1/3;grid-column:2;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.opt .hit{grid-column:1/-1;font-size:13px;color:var(--ok)}
.opts{display:grid;gap:8px}
table.prev{width:100%;border-collapse:collapse;font-size:13.5px}
.prev td,.prev th{border-bottom:1px solid var(--rule);padding:6px 4px;text-align:left}
.prev td.r{text-align:right}

/* pagos y resumen */
.props{border:1px solid var(--stamp);border-radius:14px;padding:12px;margin:0 0 16px;display:grid;gap:8px;background:var(--stamp-soft)}
.prop{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.prop .s{font-size:13.5px;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-bottom:1px solid var(--rule);padding:11px 0;min-height:64px}
.prow .pc{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .s{font-size:13.5px;color:var(--muted)}
.prow .right{grid-row:1/3;grid-column:2;display:grid;justify-items:end;gap:3px}
.sect{margin:22px 0 8px}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:3px}
.bar .lab{display:flex;justify-content:space-between;font-size:14.5px}
.bar .track{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--stamp);border-radius:4px}
details{border-top:1px solid var(--rule);padding:12px 0}
summary{font-weight:600;cursor:pointer;min-height:32px}
.note{font-size:14px;color:var(--muted)}
.banner{background:transparent;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}

#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(92vw,520px);background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 18px;font-size:15px;display:flex;align-items:center;gap:16px}
#toast .stamp{flex:none;white-space:nowrap;color:var(--paper);border-color:var(--paper);outline-color:var(--paper)}
@media (prefers-reduced-motion:reduce){.stamp.thump{animation:none}}
</style>
</head>
<body>
<div id="app"><div id="banner"></div><main id="view"></main></div>
<nav id="tabs" aria-label="Secciones"></nav>
<div id="editor" role="dialog" aria-modal="true" aria-label="Factura" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
let eurFmt;
try { eurFmt = new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', useGrouping:'always'}); }
catch (e) { eurFmt = new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'}); }
const fmt = n => eurFmt.format(Number(n) || 0);
const r2 = n => Math.round((Number(n) || 0) * 100 + (n < 0 ? -1e-9 : 1e-9)) / 100;

function parseNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v == null ? '' : v).trim().replace(/[€\s\u00a0]/g, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  s = s.replace(/^\+/, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (lc > -1) {
    s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
  } else if (ld > -1) {
    if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  }
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  const n = parseFloat(s);
  return neg ? -Math.abs(n) : n;
}
const num = v => { const n = parseNum(v); return isFinite(n) ? n : 0; };

function mk(y, m, d){
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1) return null;
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function parseDate(v){
  if (v instanceof Date && !isNaN(v)) return mk(v.getFullYear(), v.getMonth() + 1, v.getDate());
  const s = String(v == null ? '' : v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return mk(y, +m[2], +m[1]); }
  return null;
}
const todayIso = () => { const d = new Date(); return mk(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const daysBetween = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
function fmtDate(iso, short){
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', short ? {day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'});
}

const DEFAULT_CATS = ['Suministros', 'Alimentación', 'Transporte', 'Hogar', 'Salud', 'Ocio', 'Trabajo', 'Otros'];
const VATS = [21, 10, 4, 0];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ================= cálculo ================= */
function calc(inv){
  const by = {};
  for (const l of inv.lines) {
    const k = Number(l.vat) || 0;
    by[k] = by[k] || {base: 0};
    by[k].base += num(l.base);
  }
  let base = 0, vat = 0;
  for (const k in by) {
    by[k].base = r2(by[k].base);
    by[k].vat = r2(by[k].base * Number(k) / 100);
    base += by[k].base; vat += by[k].vat;
  }
  return {base: r2(base), vat: r2(vat), total: r2(base + vat), by};
}

/* ================= periodo ================= */
function inPeriod(iso, f){
  if (f.mode === 'all') return true;
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7);
  if (f.mode === 'year') return y === f.y;
  if (f.mode === 'quarter') return y === f.y && Math.ceil(m / 3) === f.q;
  return y === f.y && m === f.m;
}
function periodLabel(f){
  if (f.mode === 'all') return 'Todo el historial';
  if (f.mode === 'year') return String(f.y);
  if (f.mode === 'quarter') return f.q + '.º trimestre ' + f.y;
  return MONTHS[f.m - 1] + ' ' + f.y;
}
function shiftPeriod(f, dir){
  if (f.mode === 'year') f.y += dir;
  else if (f.mode === 'quarter') { f.q += dir; if (f.q > 4) { f.q = 1; f.y++; } if (f.q < 1) { f.q = 4; f.y--; } }
  else if (f.mode === 'month') { f.m += dir; if (f.m > 12) { f.m = 1; f.y++; } if (f.m < 1) { f.m = 12; f.y--; } }
}

/* ================= conciliación ================= */
// Importe que se cobra: el total impreso si lo hay, y si no el calculado.
function payTotal(inv){ const d = parseNum(inv.totalDeclared); return isFinite(d) ? r2(d) : calc(inv).total; }
function proposeMatches(invoices, payments, payBy){
  const free = payments.filter(p => !p.invoiceId);
  const cand = [];
  for (const inv of invoices) {
    if (payBy.has(inv.id)) continue;
    const t = payTotal(inv);
    if (t <= 0) continue;
    for (const p of free) {
      if (Math.abs(p.amount - t) > 0.009) continue;
      const d = daysBetween(p.date, inv.date);
      if (d < -5 || d > 45) continue;
      cand.push({inv, p, gap: Math.abs(d)});
    }
  }
  cand.sort((a, b) => a.gap - b.gap);
  const ui = new Set(), up = new Set(), out = [];
  for (const c of cand) {
    if (ui.has(c.inv.id) || up.has(c.p.id)) continue;
    ui.add(c.inv.id); up.add(c.p.id); out.push(c);
  }
  return out;
}

/* ================= CSV / tablas de banco ================= */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 20);
  const count = ch => lines.reduce((a, l) => a + (l.split(ch).length - 1), 0);
  const delim = [';', '\t', ','].map(d => [d, count(d)]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;

    concept = argmax(len);

  return {h, date: Math.max(date, 0), concept: Math.max(concept, 0), amount: Math.max(amount, 0)};
}

}

async function compress(file, max, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLToBlob(u){
  const m = String(u).match(/^data:([^;,]+)?(;base64)?,(.*)$/); if (!m) return null;
  const bin = atob(m[3]); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type: m[1] || 'image/jpeg'});
}

async function readInvoice(){
  if (!E || !E.blob || readCtl) return;
  if (!S.api.key) { openApiSheet(); return; }
  const btn = $('#btn-read'), out = $('#ed-read');
  const cats = S.cats.join(', ');
  const prompt =
    'Eres un asistente que extrae datos de facturas españolas a partir de la foto adjunta. Responde SOLO con un objeto JSON, sin texto adicional, con esta forma:\n' +
    '{"proveedor": string|null, "numero": string|null, "fecha": "AAAA-MM-DD"|null, "total": number|null, "categoria": string, "conceptos": [{"descripcion": string, "base": number, "iva": 21|10|4|0}]}\n' +
    'Reglas:\n- Importes en euros como números con punto decimal, sin símbolo.\n- "conceptos" agrupa la factura en líneas con su base imponible (sin IVA) y su tipo de IVA en porcentaje. Si hay varios tipos de IVA, una línea por tipo como mínimo.\n' +
    '- Si solo aparece el total con IVA y un tipo de IVA, calcula la base como total / (1 + iva/100).\n- "total" es el total final que paga el cliente.\n- "categoria" debe ser exactamente una de: ' + cats + '.\n' +
    '- Si un dato no se ve con claridad, usa null. No inventes datos.';
  readCtl = new AbortController();
  if (btn) { btn.textContent = 'Leyendo la factura…'; btn.disabled = true; }
  out.innerHTML = '<div class="msg">Leyendo la factura, puede tardar unos segundos. <button class="link" data-act="read-stop">Parar</button></div>';
  try {
    const d = await SAMPLE.json(prompt, {images: E.blob, signal: readCtl.signal});
    applyRead(d);
    out.innerHTML = '<div class="msg ok">Datos rellenados. Compáralos con la foto antes de guardar.</div>';
  } catch (e) {
    if (e && e.code === 'cancelled') out.innerHTML = '';
    else out.innerHTML = '<div class="msg err">' + esc(SAMPLE_ERR[e && e.code] || 'No se pudo leer la factura. Puedes intentarlo otra vez o rellenarla a mano.') + '</div>';
  } finally {
    readCtl = null;
    const b = $('#btn-read'); if (b) { b.textContent = 'Leer factura con Claude'; b.disabled = false; }
  }
}
function nearestVat(v){ v = Number(v); return VATS.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a, 21); }
function applyRead(d){
  if (!d || typeof d !== 'object') return;
  const inv = E.inv;
  if (d.proveedor) inv.supplier = String(d.proveedor).trim();
  if (d.numero) inv.number = String(d.numero).trim();
  const dt = parseDate(d.fecha); if (dt) inv.date = dt;
  if (d.categoria) { const c = S.cats.find(x => x.toLowerCase() === String(d.categoria).toLowerCase()); inv.category = c || 'Otros'; }
  let lines = Array.isArray(d.conceptos) ? d.conceptos.map(l => ({desc: String((l && l.descripcion) || '').trim(), base: r2(num(l && l.base)), vat: nearestVat(l && l.iva)})).filter(l => l.base !== 0) : [];
  const tot = parseNum(d.total);
  if (!lines.length && isFinite(tot)) lines = [{desc: '', base: r2(tot / 1.21), vat: 21}];
  if (lines.length) inv.lines = lines.map(l => ({desc: l.desc, vat: l.vat, base: String(l.base).replace('.', ',')}));
  if (isFinite(tot)) inv.totalDeclared = String(r2(tot)).replace('.', ',');
  E.dirty = true;
  const ed = $('#editor');
  ['supplier', 'date', 'number', 'totalDeclared'].forEach(f => { const el = ed.querySelector('[data-f="' + f + '"]'); if (el) el.value = inv[f]; });
  edCatSelect(); edLines(); edTotals();
}

async function saveEditor(){
  const inv = E.inv, supplier = String(inv.supplier).trim();
  const fail = (m) => { edMsg(m, 'err'); return false; };
  if (!supplier) return fail('Falta el proveedor.');
  if (!parseDate(inv.date)) return fail('Revisa la fecha.');
  const lines = inv.lines.map(l => ({desc: String(l.desc || '').trim(), base: r2(num(l.base)), vat: Number(l.vat) || 0})).filter(l => l.base !== 0 || l.desc);
  if (!lines.length || lines.every(l => l.base === 0)) return fail('Añade al menos un concepto con su base imponible.');
  const rec = {id: inv.id, date: inv.date, supplier, number: String(inv.number || '').trim(), category: inv.category || 'Otros', lines,
    totalDeclared: isFinite(parseNum(inv.totalDeclared)) ? r2(parseNum(inv.totalDeclared)) : null, note: String(inv.note || '').trim(),
    image: E.blob || null, thumb: E.thumb || null, createdAt: inv.createdAt || Date.now()};
  const total = calc(rec).total;
  if (E.isNew && !E.dup && S.invoices.some(i => i.supplier.toLowerCase() === supplier.toLowerCase() && i.date === rec.date && Math.abs(calc(i).total - total) < 0.005)) {
    E.dup = true; edMsg('Ya tienes una factura de este proveedor, con esta fecha y este importe. Toca Guardar otra vez si quieres guardarla igualmente.', 'warn'); return false;
  }
  await dbPut('invoices', rec);
  const ix = S.invoices.findIndex(i => i.id === rec.id);
  if (ix >= 0) S.invoices[ix] = rec; else S.invoices.push(rec);
  urlCache.delete(rec.id);
  const wasNew = E.isNew;
  closeEditor(true);
  const hint = wasNew && proposeMatches([rec], S.payments, payMap()).length ? ' Hay un pago que coincide: míralo en Pagos.' : '';
  if (!inPeriod(rec.date, S.f)) { const [y, m] = rec.date.split('-').map(Number); S.f.y = y; S.f.m = m; S.f.q = Math.ceil(m / 3); }
  render(); toast('Factura guardada.' + hint);
  return true;
}
function closeEditor(force){
  if (!E) return;
  if (!force && E.dirty) { confirmSheet('¿Descartar los cambios?', 'Lo que has escrito en esta factura no se guardará.', 'Descartar', () => closeEditor(true), true); return; }
  if (readCtl) readCtl.abort();
  if (E.url) URL.revokeObjectURL(E.url);
  E = null; const ed = $('#editor'); ed.hidden = true; ed.innerHTML = ''; closeSheet(); syncLock();
}
function deleteInvoice(){
  const id = E.inv.id;
  confirmSheet('¿Borrar esta factura?', 'Se elimina también su foto. Si tenía un pago vinculado, el pago queda libre.', 'Borrar', async () => {
    const un = S.payments.filter(p => p.invoiceId === id);
    un.forEach(p => { p.invoiceId = null; }); await dbPutMany('payments', un);
    await dbDel('invoices', id); S.invoices = S.invoices.filter(i => i.id !== id); urlCache.delete(id);
    closeEditor(true); render(); toast('Factura borrada.');
  }, true);
}

async function doLink(pid, iid, quiet){
  const p = S.payments.find(x => x.id === pid), inv = S.invoices.find(x => x.id === iid);
  if (!p || !inv) return;
  p.invoiceId = iid; await dbPut('payments', p);
  if (!quiet) toast('Factura de ' + inv.supplier + ' vinculada.', true);
}
async function doUnlink(pid){
  const p = S.payments.find(x => x.id === pid); if (!p) return;
  p.invoiceId = null; await dbPut('payments', p);
}
function linkSheetForInvoice(){
  const inv = E.inv, t = payTotal(inv);
  const list = S.payments.filter(p => !p.invoiceId).map(p => ({p, hit: Math.abs(p.amount - t) < 0.009, gap: Math.abs(daysBetween(p.date, inv.date))}))
    .sort((a, b) => (b.hit - a.hit) || (a.gap - b.gap)).slice(0, 40);
  openSheet('<h2>Elige el pago</h2>' + (list.length ? '<div class="opts">' + list.map(x => '<button class="opt" data-act="do-link-inv" data-p="' + esc(x.p.id) + '"><span class="t">' + esc(x.p.concept || 'Sin concepto') + '</span><span class="s">' + esc(fmtDate(x.p.date)) + '</span><span class="a">' + fmt(x.p.amount) + '</span>' + (x.hit ? '<span class="hit">Coincide el importe</span>' : '') + '</button>').join('') + '</div>' : '<p class="note">No hay pagos libres. Importa el extracto de tu banco en la pestaña Pagos.</p>') + '<button class="btn" data-act="sheet-close">Cerrar</button>');
}
function linkSheetForPayment(pid){
  const p = S.payments.find(x => x.id === pid); if (!p) return;
  const pm = payMap();
  const list = S.invoices.filter(i => !pm.has(i.id)).map(i => ({i, t: payTotal(i)})).map(x => Object.assign(x, {hit: Math.abs(x.t - p.amount) < 0.009, gap: Math.abs(daysBetween(p.date, x.i.date))}))
    .sort((a, b) => (b.hit - a.hit) || (a.gap - b.gap)).slice(0, 40);
  openSheet('<h2>Elige la factura</h2><p class="note" style="margin:0">Pago de ' + fmt(p.amount) + ' del ' + esc(fmtDate(p.date)) + '</p>' + (list.length ? '<div class="opts">' + list.map(x => '<button class="opt" data-act="do-link-pay" data-p="' + esc(p.id) + '" data-i="' + esc(x.i.id) + '"><span class="t">' + esc(x.i.supplier) + '</span><span class="s">' + esc(fmtDate(x.i.date)) + '</span><span class="a">' + fmt(x.t) + '</span>' + (x.hit ? '<span class="hit">Coincide el importe</span>' : '') + '</button>').join('') + '</div>' : '<p class="note">No hay facturas sin pago. Añade primero la factura.</p>') + '<button class="btn" data-act="sheet-close">Cerrar</button>');
}
function paySheetNew(){
  openSheet('<h2>Añadir pago</h2><label class="fld"><span>Fecha</span><input type="date" id="np-date" value="' + todayIso() + '"></label><label class="fld"><span>Concepto</span><input id="np-con" autocomplete="off" placeholder="Por ejemplo, Mercadona"></label><label class="fld"><span>Importe</span><input id="np-amt" inputmode="decimal" placeholder="0,00"></label><div id="np-msg"></div><div class="btn-row" style="margin:0"><button class="btn" data-act="sheet-close">Cancelar</button><button class="btn primary" data-act="pay-save">Guardar pago</button></div>');
}

/* ================= importar extracto ================= */
async function openImport(file){
  try {
    const name = file.name.toLowerCase(), buf = await file.arrayBuffer();
    let rows;
    if (/\.(xlsx|xls|xlsm|ods)$/.test(name)) {
      const X = await loadXLSX();
      const wb = X.read(buf, {type: 'array', cellDates: true});
      rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false, defval: '', dateNF: 'yyyy-mm-dd'});
    } else {
      let text; try { text = new TextDecoder('utf-8', {fatal: true}).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
      rows = parseCSV(text);
    }
    if (rows.length < 2) throw new Error('vacío');
    const cols = guessCols(rows);
    const neg = rows.slice(cols.h + 1, cols.h + 80).filter(r => parseNum(r[cols.amount]) < 0).length;
    IMP = {rows, cols, sign: neg > 0 ? 'neg' : 'pos'};
    renderImport();
  } catch (e) {
    toast('No he podido leer ese archivo. Prueba con el CSV o el Excel que descargas del banco.');
  }
}
function renderImport(){
  const {rows, cols, sign} = IMP;
  const maxC = Math.max(...rows.slice(0, 60).map(r => r.length));
  const head = rows[cols.h] || [];
  const opt = (sel) => Array.from({length: maxC}, (_, c) => '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + esc(String(head[c] || '').trim() || 'Columna ' + (c + 1)) + '</option>').join('');
  const parsed = extractPayments(rows, cols, sign);
  const sample = parsed.slice(0, 5);
  openSheet('<h2>Importar extracto</h2><p class="note" style="margin:0">Comprueba que las columnas son las correctas.</p>' +
    '<div class="two"><label class="fld"><span>Fecha</span><select data-imp="date">' + opt(cols.date) + '</select></label><label class="fld"><span>Importe</span><select data-imp="amount">' + opt(cols.amount) + '</select></label></div>' +
    '<label class="fld"><span>Concepto</span><select data-imp="concept">' + opt(cols.concept) + '</select></label>' +
    '<label class="fld"><span>Los gastos aparecen como importes</span><select data-imp="sign"><option value="neg"' + (sign === 'neg' ? ' selected' : '') + '>Negativos</option><option value="pos"' + (sign === 'pos' ? ' selected' : '') + '>Positivos</option></select></label>' +
    (sample.length ? '<table class="prev"><tr><th>Fecha</th><th>Concepto</th><th class="r">Importe</th></tr>' + sample.map(p => '<tr><td>' + esc(fmtDate(p.date, true)) + '</td><td>' + esc(p.concept.slice(0, 28)) + '</td><td class="r">' + fmt(p.amount) + '</td></tr>').join('') + '</table>' : '<div class="msg err">Con estas columnas no salen pagos. Cambia la selección.</div>') +
    '<div class="btn-row" style="margin:0"><button class="btn" data-act="sheet-close">Cancelar</button><button class="btn primary" data-act="imp-go"' + (parsed.length ? '' : ' disabled') + '>Importar ' + parsed.length + ' pagos</button></div>');
}
async function doImport(){
  const {rows, cols, sign} = IMP;
  const parsed = extractPayments(rows, cols, sign);
  const have = new Map();
  for (const p of S.payments) { const k = payKey(p); have.set(k, (have.get(k) || 0) + 1); }
  const seen = new Map(), add = [];
  for (const p of parsed) {
    const k = payKey(p), n = seen.get(k) || 0; seen.set(k, n + 1);
    if (n < (have.get(k) || 0)) continue;
    add.push({id: uid(), date: p.date, concept: p.concept, amount: p.amount, invoiceId: null, source: 'import'});
  }
  S.payments.push(...add); await dbPutMany('payments', add);
  closeSheet(); S.tab = 'pagos'; S.pf = 'sin'; S.f.mode = 'all'; render(true);
  toast('Importados ' + add.length + ' pagos' + (parsed.length - add.length ? ' (' + (parsed.length - add.length) + ' ya estaban)' : '') + '.');
}

/* ================= copia de seguridad ================= */
async function exportBackup(){
  try {
    const inv = await Promise.all(S.invoices.map(async i => Object.assign({}, i, {image: i.image ? await blobToDataURL(i.image) : null, thumb: undefined})));
    const data = JSON.stringify({app: 'facturas-personal', v: 1, exportedAt: new Date().toISOString(), cats: S.cats, invoices: inv, payments: S.payments});
    await DL.save({filename: 'facturas-copia-' + todayIso() + '.json', data});
    await saveBackupDate(); render(); toast('Copia guardada.');
  } catch (e) { if (!e || e.code !== 'declined') toast('No se ha podido guardar la copia.'); }
}
async function restoreBackup(file){
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'facturas-personal' || !Array.isArray(d.invoices)) throw new Error('formato');
    const haveI = new Set(S.invoices.map(i => i.id)), haveP = new Set(S.payments.map(p => p.id));
    let ni = 0, np = 0; const newI = [], newP = [];
    for (const i of d.invoices) {
      if (!i || !i.id || haveI.has(i.id) || !Array.isArray(i.lines) || !parseDate(i.date)) continue;
      const blob = i.image ? dataURLToBlob(i.image) : null;
      let thumb = null; if (blob) { try { thumb = await compress(blob, 220, 0.7); } catch (e) {} }
      newI.push({id: String(i.id), date: i.date, supplier: String(i.supplier || ''), number: String(i.number || ''), category: String(i.category || ''), lines: i.lines.map(l => ({desc: String(l.desc || ''), base: r2(num(l.base)), vat: nearestVat(l.vat)})), totalDeclared: i.totalDeclared == null ? null : num(i.totalDeclared), note: String(i.note || ''), image: blob, thumb, createdAt: Number(i.createdAt) || Date.now()});
    }
    for (const p of (Array.isArray(d.payments) ? d.payments : [])) {
      if (!p || !p.id || haveP.has(p.id) || !parseDate(p.date) || !isFinite(parseNum(p.amount))) continue;
      newP.push({id: String(p.id), date: p.date, concept: String(p.concept || ''), amount: r2(num(p.amount)), invoiceId: p.invoiceId ? String(p.invoiceId) : null, source: p.source || 'import'});
    }
    S.invoices.push(...newI); S.payments.push(...newP); ni = newI.length; np = newP.length;
    await dbPutMany('invoices', newI); await dbPutMany('payments', newP);
    if (Array.isArray(d.cats)) { const extra = d.cats.map(String).filter(c => !S.cats.includes(c)); if (extra.length) { S.cats.push(...extra); await saveCats(); } }
    render(); toast('Restauradas ' + ni + ' facturas y ' + np + ' pagos.');
  } catch (e) { toast('Ese archivo no parece una copia de seguridad de esta app.'); }
}
function invoicesCSV(rows){
  const pm = payMap(), q = v => { v = String(v == null ? '' : v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const n = v => String(r2(v)).replace('.', ',');
  const out = [['Fecha', 'Proveedor', 'Nº factura', 'Tipología', 'Concepto', 'Base', 'IVA %', 'Cuota IVA', 'Total línea', 'Pagada'].join(';')];
  for (const i of rows) for (const l of i.lines) {
    const b = num(l.base), v = r2(b * l.vat / 100);
    out.push([i.date, i.supplier, i.number, i.category, l.desc, n(b), l.vat, n(v), n(b + v), pm.has(i.id) ? 'Sí' : 'No'].map(q).join(';'));
  }
  return '\uFEFF' + out.join('\r\n');
}
async function exportCSV(){
  const rows = S.invoices.filter(i => inPeriod(i.date, S.f)).sort((a, b) => a.date < b.date ? -1 : 1);
  if (!rows.length) { toast('No hay facturas en este periodo.'); return; }
  const tag = S.f.mode === 'all' ? 'todo' : S.f.mode === 'year' ? S.f.y : S.f.mode === 'quarter' ? S.f.y + '-T' + S.f.q : S.f.y + '-' + String(S.f.m).padStart(2, '0');
  try { await DL.save({filename: 'facturas-' + tag + '.csv', data: invoicesCSV(rows)}); toast('Archivo listo.'); }
  catch (e) { if (!e || e.code !== 'declined') toast('No se ha podido guardar el archivo.'); }
}

/* ================= eventos ================= */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    case 'tab': S.tab = v; render(true); break;
    case 'new-inv': if (!E) openEditor(null); break;
    case 'open-inv': openEditor(b.dataset.id); break;
    case 'mode': {
      const f = S.f;
      if (v === 'quarter') f.q = Math.ceil(f.m / 3);
      if (v === 'month' && f.mode === 'quarter') f.m = (f.q - 1) * 3 + 1;
      f.mode = v; render(); break;
    }
    case 'pshift': shiftPeriod(S.f, +v); S.f.q = S.f.mode === 'month' ? Math.ceil(S.f.m / 3) : S.f.q; render(); break;
    case 'pf': S.pf = v; S.payLimit = 150; render(); break;
    case 'more-pays': S.payLimit += 200; render(); break;
    case 'sheet-close': closeSheet(); break;
    case 'confirm-ok': { const cb = confirmSheet.cb; closeSheet(); if (cb) cb(); break; }
    case 'ed-close': closeEditor(false); break;
    case 'ed-save': b.disabled = true; try { await saveEditor(); } finally { b.disabled = false; } break;
    case 'ed-delete': deleteInvoice(); break;
    case 'line-add': E.inv.lines.push({desc: '', base: '', vat: 21}); E.dirty = true; edLines(); edTotals(); break;
    case 'line-del': E.inv.lines.splice(+b.dataset.i, 1); E.dirty = true; edLines(); edTotals(); break;
    case 'cat-add': {
      const el = $('#newcat-in'), name = el.value.trim();
      if (!name) { el.focus(); break; }
      if (!S.cats.some(c => c.toLowerCase() === name.toLowerCase())) { S.cats.push(name); await saveCats(); }
      E.inv.category = S.cats.find(c => c.toLowerCase() === name.toLowerCase()); E.dirty = true;
      $('#ed-newcat').hidden = true; el.value = ''; edCatSelect(); break;
    }
    case 'zoom': openSheet('<img src="' + E.url + '" alt="Foto de la factura"><button class="btn" data-act="sheet-close">Cerrar</button>', 'full'); break;
    case 'read': readInvoice(); break;
    case 'read-stop': if (readCtl) readCtl.abort(); break;
    case 'ed-link': linkSheetForInvoice(); break;
    case 'do-link-inv': closeSheet(); await doLink(b.dataset.p, E.inv.id); edPay(); break;
    case 'ed-unlink': { const p = payMap().get(E.inv.id); if (p) { await doUnlink(p.id); edPay(); } break; }
    case 'pay-link': linkSheetForPayment(b.dataset.p); break;
    case 'do-link-pay': closeSheet(); await doLink(b.dataset.p, b.dataset.i); render(); break;
    case 'link': await doLink(b.dataset.p, b.dataset.i); render(); break;
    case 'link-all': {
      const props = proposeMatches(S.invoices, S.payments, payMap());
      for (const c of props) await doLink(c.p.id, c.inv.id, true);
      render(); toast(props.length + ' facturas vinculadas.', true); break;
    }
    case 'unlink': await doUnlink(b.dataset.p); render(); break;
    case 'pay-new': paySheetNew(); break;
    case 'pay-save': {
      const date = parseDate($('#np-date').value), amt = parseNum($('#np-amt').value), con = $('#np-con').value.trim();
      if (!date || !isFinite(amt) || amt <= 0) { $('#np-msg').innerHTML = '<div class="msg err">Pon una fecha y un importe mayor que cero.</div>'; break; }
      const p = {id: uid(), date, concept: con, amount: r2(amt), invoiceId: null, source: 'manual'};
      S.payments.push(p); await dbPut('payments', p); closeSheet(); S.tab = 'pagos'; render(); toast('Pago añadido.'); break;
    }
    case 'imp-go': await doImport(); break;
    case 'api-open': openApiSheet(); break;
    case 'api-save': {
      const key = $('#api-key').value.trim(), cm = $('#api-custom').value.trim();
      if (key && !/^sk-ant-/.test(key)) { $('#api-msg').innerHTML = '<div class="msg err">La clave debe empezar por sk-ant-. Cópiala entera desde la consola de Anthropic.</div>'; break; }
      S.api = {key, model: cm || $('#api-model').value}; await dbPut('meta', {k: 'api', v: S.api});
      closeSheet(); toast(key ? 'Ajustes guardados.' : 'Clave quitada.'); if (E) edPhoto(); else if (S.tab === 'resumen') render(); break;
    }
    case 'api-clear': S.api.key = ''; await dbPut('meta', {k: 'api', v: S.api}); closeSheet(); toast('Clave quitada.'); if (E) edPhoto(); else if (S.tab === 'resumen') render(); break;
    case 'share-file': {
      const f = DL.pending; if (!f) break;
      try { await navigator.share({files: [f]}); if (/\.json$/.test(f.name)) await saveBackupDate(); closeSheet(); }
      catch (e) { if (!e || e.name !== 'AbortError') toast('No se puede compartir desde aquí. Usa Descargar.'); }
      break;
    }
    case 'dl-file': {
      const f = DL.pending; if (!f) break;
      const u = URL.createObjectURL(f), a = document.createElement('a'); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
      if (/\.json$/.test(f.name)) await saveBackupDate(); closeSheet(); break;
    }
    case 'export-csv': exportCSV(); break;
    case 'backup': exportBackup(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { S.q = t.value; renderList(); return; }
  if (!E) return;
  if (t.dataset.f && t.dataset.f !== 'category') {
    E.inv[t.dataset.f] = t.value; E.dirty = true; E.dup = false;
    if (t.dataset.f === 'totalDeclared') edTotals();
  } else if (t.dataset.lk) {
    const row = t.closest('.line'), l = E.inv.lines[+row.dataset.i]; if (!l) return;
    l[t.dataset.lk] = t.dataset.lk === 'vat' ? Number(t.value) : t.value; E.dirty = true; E.dup = false;
    if (t.dataset.lk !== 'desc') {
      const b = num(l.base), v = r2(b * l.vat / 100);
      row.querySelector('.lc-vat').textContent = fmt(v); row.querySelector('.lc-tot').textContent = fmt(b + v); edTotals();
    }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'catf') { S.cat = t.value; renderList(); return; }
  if (t.dataset.file === 'photo') { const f = t.files && t.files[0]; t.value = ''; onPhoto(f); return; }
  if (t.dataset.file === 'stmt') { const f = t.files && t.files[0]; t.value = ''; if (f) openImport(f); return; }
  if (t.dataset.file === 'restore') { const f = t.files && t.files[0]; t.value = ''; if (f) restoreBackup(f); return; }
  if (t.dataset.imp && IMP) {
    if (t.dataset.imp === 'sign') IMP.sign = t.value; else IMP.cols[t.dataset.imp] = +t.value;
    renderImport(); return;
  }
  if (!E) return;
  if (t.dataset.f === 'category') {
    if (t.value === '__new') { $('#ed-newcat').hidden = false; $('#newcat-in').focus(); }
    else { E.inv.category = t.value; E.dirty = true; $('#ed-newcat').hidden = true; }
  } else if (t.dataset.f === 'supplier' && !E.inv.category) {
    const prev = S.invoices.filter(i => i.supplier.toLowerCase() === t.value.trim().toLowerCase() && i.category).sort((a, b) => b.createdAt - a.createdAt)[0];
    if (prev) { E.inv.category = prev.category; edCatSelect(); }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (E) closeEditor(false); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('label.btn[tabindex]')) { ev.preventDefault(); const i = ev.target.querySelector('input'); if (i) i.click(); }
});

/* ================= arranque ================= */
async function init(){
  renderTabs();
  try { db = await openDB(); DBOK = true; } catch (e) { DBOK = false; $('#banner').innerHTML = '<div class="banner">Este navegador no permite guardar datos aquí. Lo que añadas se perderá al cerrar. Abre la app en Safari.</div>'; }
  try {
    S.invoices = await dbAll('invoices'); S.payments = await dbAll('payments');
    const meta = await dbAll('meta');
    for (const m of meta) { if (m.k === 'cats' && Array.isArray(m.v) && m.v.length) S.cats = m.v; if (m.k === 'lastBackup') S.lastBackup = m.v; if (m.k === 'api' && m.v) S.api = Object.assign(S.api, m.v); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {}
  render();
}

if (window.__TEST__) {
  window.__t = {parseNum, parseDate, calc, parseCSV, guessCols, extractPayments, proposeMatches, payTotal, payKey, inPeriod, r2, invoicesCSV, nearestVat};
} else { init(); }
})();
